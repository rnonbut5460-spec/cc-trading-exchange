<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>LCC Trading Exchange — Demo</title>
<style>
:root{--bg:#080d19;--panel:#111a2b;--panel2:#172238;--line:#26344d;--text:#eef4ff;--muted:#91a1bd;--green:#31d49a;--red:#ff6b7a;--blue:#6da7ff;--gold:#f6c86b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#12213c 0,#080d19 48%);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:86px}
button,input,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1050px;margin:auto;padding:18px 16px 24px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#53e0ad,#2677ff);display:grid;place-items:center;font-weight:900;color:#061322;box-shadow:0 8px 24px #1a9f9a33}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;margin:4px 0 0;color:var(--muted);letter-spacing:1.4px}.demo{font-size:11px;font-weight:800;color:#171204;background:var(--gold);border-radius:7px;padding:7px 9px}
h2{font-size:23px;margin:8px 0 5px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.panel{background:linear-gradient(160deg,#141f33,#101827);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 28px #0002}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}.balance{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.amount{font-size:32px;font-weight:800;letter-spacing:-1px;margin:8px 0}.small{font-size:12px;color:var(--muted)}.positive{color:var(--green)}.negative{color:var(--red)}.actions{display:flex;gap:9px;margin-top:16px}.btn{padding:12px 14px;border-radius:11px;font-weight:750;background:var(--green);color:#061a17}.btn.secondary{background:#22324b;color:var(--text);border:1px solid #354763}.btn.danger{background:#402331;color:#ffb4be}.btn.full{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{padding:13px;border-radius:14px;background:#0c1423;border:1px solid #22314a}.stat strong{display:block;font-size:18px;margin-top:7px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 0 11px}.section-title h3{margin:0;font-size:16px}.link{color:var(--blue);font-size:12px;background:none;padding:5px}
.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:11px;font-weight:600;padding:10px 4px;border-bottom:1px solid var(--line)}.table td{padding:13px 4px;border-bottom:1px solid #1d2a40;font-size:13px}.table tr:last-child td{border-bottom:0}.coin{display:flex;align-items:center;gap:9px;font-weight:700}.coinicon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#263a57;font-size:12px}.coin small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:3px}.right{text-align:right}.hidden{display:none!important}.nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0b1220ee;border-top:1px solid #26344d;backdrop-filter:blur(18px);display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom))}.nav button{background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:53px}.nav button span{font-size:19px}.nav button.active{color:var(--green)}.pill{display:inline-block;padding:5px 8px;border-radius:7px;font-size:10px;font-weight:800;background:#20394a;color:var(--green)}.pill.warn{background:#40351e;color:var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.bot{padding:15px;border:1px solid var(--line);border-radius:15px;background:#0d1626;margin-bottom:11px}.bot h4{margin:0 0 6px}.bot .apy{font-size:24px;font-weight:800;color:var(--green)}.field{margin:13px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border-radius:10px;border:1px solid #35445e;background:#0a1220;color:var(--text)}.notice{font-size:12px;color:var(--gold);background:#302817;border:1px solid #57451f;padding:12px;border-radius:12px;line-height:1.5}.modal{position:fixed;inset:0;background:#020611d9;z-index:10;display:grid;place-items:end center;padding:12px}.modalbox{width:100%;max-width:500px;max-height:85vh;overflow:auto;background:#111b2d;border:1px solid #35445e;border-radius:20px;padding:19px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.close{background:#26354d;color:white;border-radius:9px;padding:8px 11px}.file{font-size:12px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#d8fff0;color:#063d2a;padding:12px 16px;border-radius:12px;font-weight:750;z-index:20;box-shadow:0 8px 25px #0005;max-width:90%;text-align:center}
footer{text-align:center;color:#657693;font-size:11px;padding:20px 5px 4px;line-height:1.6}
@media(min-width:700px){.wrap{padding-top:28px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.homegrid{grid-template-columns:1.25fr .75fr}.modal{place-items:center}.amount{font-size:39px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">LCC</div><div><h1>LCC Trading Exchange</h1><p>TRADE SMARTER</p></div></div><div class="demo">DEMO MODE</div></header>
<main id="view"></main>
<footer>Prototype for demonstration only. Prices, balances, bot returns and transactions are simulated.<br>Not connected to a bank, blockchain, exchange, or real KYC provider.</footer>
</div>
<nav class="nav">
<button class="active" data-page="home"><span>⌂</span>Home</button>
<button data-page="market"><span>◈</span>Market</button>
<button data-page="trade"><span>↗</span>Trade</button>
<button data-page="bots"><span>◎</span>Bots</button>
<button data-page="futures"><span>⇄</span>Futures</button>
<button data-page="assets"><span>▣</span>Assets</button>
</nav>
<div id="modalroot"></div><div id="toastroot"></div>
<script>
const coins=[
 {symbol:'BTC',name:'Bitcoin',icon:'₿',price:67425.80,change:2.41},
 {symbol:'ETH',name:'Ethereum',icon:'◆',price:3520.45,change:1.28},
 {symbol:'BNB',name:'BNB',icon:'B',price:612.18,change:-0.62},
 {symbol:'SOL',name:'Solana',icon:'S',price:178.62,change:4.13},
 {symbol:'XRP',name:'XRP',icon:'X',price:0.6241,change:-1.17},
{ symbol: 'AAPL', name: 'Apple Inc.', icon: '🍎', price: 230.50, change: 0, type: 'stock' },
{ symbol: 'TSLA', name: 'Tesla Inc.', icon: '🚗', price: 215.80, change: 0, type: 'stock' },
{ symbol: 'NVDA', name: 'NVIDIA Corp.', icon: '🟢', price: 138.20, change: 0, type: 'stock' },
];
let state={page:'home',balance:100000,assets:{BTC:0.006,ETH:0.08,USDT:420},bots:[],positions:[],kyc:'NOT VERIFIED'};
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(msg){document.getElementById('toastroot').innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>document.getElementById('toastroot').innerHTML='',2600)}
function setPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function marketRows(){
  return coins.map(c=>{
    const change = Number(c.change) || 0;
    return `<tr>
      <td><div class="coin">
        <div class="coinicon">${c.icon}</div>
        <div>${c.symbol}<small>${c.name}</small></div>
      </div></td>
      <td class="right">$${c.price < 1 ? c.price.toFixed(4) : fmt(c.price)}</td>
      <td class="right ${change >= 0 ? 'positive' : 'negative'}">${change > 0 ? '+' : ''}${change.toFixed(2)}%</td>
    </tr>`;
  }).join('');
}

function home(){return `<h2>Welcome back</h2><p class="sub">Your digital asset dashboard</p><div class="grid homegrid"><section class="panel"><div class="balance"><div><div class="eyebrow">Estimated total balance</div><div class="amount">$${fmt(state.balance)}</div><div class="small"><span class="positive">+$24.50 (2.51%)</span> <span>today · demo data</span></div></div><span class="pill">● Demo</span></div><div class="actions"><button class="btn" onclick="openModal('deposit')">＋ Deposit</button><button class="btn secondary" onclick="openModal('withdraw')">↗ Withdraw</button></div></section><section class="panel"><div class="eyebrow">Portfolio overview</div><div class="grid" style="margin-top:12px"><div class="stat"><span class="small">Assets</span><strong>3</strong></div><div class="stat"><span class="small">Active bots</span><strong>${state.bots.length}</strong></div><div class="stat"><span class="small">Open positions</span><strong>${state.positions.length}</strong></div><div class="stat"><span class="small">KYC status</span><strong style="font-size:13px">${state.kyc}</strong></div></div></section></div><div class="section-title"><h3>Market overview</h3><button class="link" onclick="setPage('market')">View all →</button></div><section class="panel"><table class="table"><thead><tr><th>Asset</th><th class="right">Price</th><th class="right">24h</th></tr></thead><tbody>${marketRows()}</tbody></table></section><div class="notice">Demo only: no real funds or trades are processed. Do not deposit money or upload real identity documents to this prototype.</div>`}
function market(){return `<h2>Market</h2><p class="sub">Explore digital assets · illustrative prices</p><section class="panel"><table class="table"><thead><tr><th>Asset</th><th class="right">Price (USD)</th><th class="right">24h</th></tr></thead><tbody>${marketRows()}</tbody></table></section><section class="panel"><h3 style="margin-top:0">Quick trade simulator</h3><div class="field"><label>Asset</label><select id="tradecoin">${coins.map(c=>`<option value="${c.symbol}">${c.symbol} — ${c.name}</option>`).join('')}</select></div><div class="field"><label>Amount (USD)</label><input id="tradeamount" type="number" min="1" max="${state.balance}" value="25"></div><button class="btn full" onclick="simulateTrade()">Simulate buy</button><p class="small">This simulator does not place a real order.</p></section>`}

function trade(){
  return `<h2>Trade</h2>
  <p class="sub">Buy & Sell</p>
  <section class="panel">
    <div class="notice">
      Paper trading only — no real money or exchange orders.
    </div>

    <div class="field">
      <label>Choose asset</label>
      <select id="tradecoin">
        ${coins.map(c=>`<option value="${c.symbol}">${c.symbol} — ${c.name}</option>`).join('')}
      </select>
    </div>

    <div class="field">
      <label>Amount (USD)</label>
      <input id="tradeamount" type="number" min="1"
        value="25" inputmode="decimal">
    </div>

    <div class="stat">
      <span class="small">Available demo balance</span>
      <strong>$${fmt(state.balance)}</strong>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn full" onclick="simulateTrade()">Buy</button>
      <button class="btn full" style="background-color:#e53935 !important;color:#ffffff !important;border:1px solid #e53935 !important" onclick="simulateSell()">Sell</button>
    </div>

    <p class="small">Demo balances and trades only.</p>
  </section>

  <div class="section-title">
    <h3>Market prices</h3>
    <button class="link" onclick="setPage('market')">View market →</button>
  </div>

  <section class="panel">
    <table class="table">
      <thead><tr>
        <th>Asset</th>
        <th class="right">Price (USD)</th>
        <th class="right">24h</th>
      </tr></thead>
      <tbody>${marketRows()}</tbody>
    </table>
  </section>`;
}

function bots(){return `<h2>Trading Bots</h2><p class="sub">Automated strategy dashboard · demo mode</p><div class="notice">Displayed APY figures are examples only, not guaranteed or forecast returns. No bot is connected to a real exchange.</div><div class="section-title"><h3>Strategy templates</h3></div>${[['Grid Bot','Range-based simulated strategy','8.4%'],['DCA Bot','Recurring purchase simulator','5.2%'],['Trend Bot','Trend-following simulation','11.8%']].map((b,i)=>`<div class="bot"><div class="row"><div><h4>${b[0]}</h4><div class="small">${b[1]}</div></div><span class="pill warn">DEMO</span></div><div class="row" style="margin:15px 0"><div><div class="eyebrow">Example APY</div><div class="apy">${b[2]}</div></div><button class="btn" onclick="startBot('${b[0]}')">Start demo</button></div></div>`).join('')}<div class="section-title"><h3>Your active demo bots</h3></div>${state.bots.length?state.bots.map((b,i)=>`<div class="bot row"><div><h4>${b}</h4><div class="small">Running locally · simulation only</div></div><button class="btn danger" onclick="stopBot(${i})">Stop</button></div>`).join(''):'<div class="panel small">No active bots yet. Start a demo strategy above.'}</div>`}
function futures(){return `<h2>Futures</h2><p class="sub">Practice trading interface</p><div class="notice">Leveraged trading is high risk. This page is a practice simulator only and does not submit real orders.</div><section class="panel"><div class="row"><div><div class="eyebrow">Contract</div><h3 style="margin:6px 0">BTC/USDT Perpetual</h3></div><span class="pill">SIMULATOR</span></div><div class="stat" style="margin:14px 0"><div class="eyebrow">Reference price</div><strong>$${fmt(coins[0].price)}</strong><div class="small">Illustrative market data</div></div><div class="field"><label>Position size (USD)</label><input id="futuresize" type="number" min="1" value="50"></div><div class="field"><label>Leverage (simulation only)</label><select id="leverage"><option>1x</option><option>2x</option><option>5x</option><option>10x</option></select></div><div class="actions"><button class="btn full" onclick="openPosition('LONG')"> Long </button><button class="btn danger full" onclick="openPosition('SHORT')">Short </button></div></section><div class="section-title"><h3>Open demo positions</h3></div>${state.positions.length?state.positions.map((p,i)=>`<div class="bot row"><div><h4 class="${p.side==='LONG'?'positive':'negative'}">${p.side} · BTC/USDT</h4><div class="small">$${fmt(p.size)} notional · ${p.leverage}</div></div><button class="btn secondary" onclick="closePosition(${i})">Close</button></div>`).join(''):'<div class="panel small">No open demo positions.</div>'}`}
function assets(){return `<h2>Assets</h2><p class="sub">Your simulated wallet balances</p><section class="panel"><div class="eyebrow">Estimated total</div><div class="amount">$${fmt(state.balance)}</div><div class="small">Values below are sample values stored only in this page.</div></section><section class="panel"><table class="table"><thead><tr><th>Asset</th><th class="right">Balance</th></tr></thead><tbody>${Object.entries(state.assets).map(([s,a])=>`<tr><td><div class="coin"><div class="coinicon">${s==='BTC'?'₿':s==='ETH'?'◆':'$'}</div><div>${s}<small>${s==='USDT'?'Tether':s==='BTC'?'Bitcoin':'Ethereum'}</small></div></div></td><td class="right">${a}</td></tr>`).join('')}</tbody></table><div class="actions"><button class="btn" onclick="openModal('deposit')">Deposit</button><button class="btn secondary" onclick="openModal('withdraw')">Withdraw</button></div></section><section class="panel"><div class="row"><div><h3 style="margin:0 0 6px">Identity verification</h3><div class="small">Status: ${state.kyc}</div></div><button class="btn secondary" onclick="openModal('kyc')">Open KYC</button></div></section>`}
function render(){const v=document.getElementById('view');v.innerHTML=({home,market,trade,bots,futures,assets}[state.page]||home)()}render();
function openModal(type){let content='';
if(type==='deposit')content=`<h3>Deposit funds</h3><p class="sub">Demo deposit — no real transfer will occur.</p><div class="field"><label>Method</label><select id="depositmethod"><option>Bank transfer (demo)</option><option>LAO QR (demo)</option><option>USDT wallet (demo)</option></select></div><div class="field"><label>Amount (USD)</label><input id="depositamount" type="number" min="1" value="100"></div><div class="notice">No bank account or payment gateway is connected. Never transfer money using this prototype.</div><button class="btn full" onclick="demoDeposit()">Simulate deposit</button>`;
if(type==='withdraw')content=`<h3>Withdraw funds</h3><p class="sub">Demo withdrawal — no real transfer will occur.</p><div class="field"><label>Amount (USD)</label><input id="withdrawamount" type="number" min="1" value="50"></div><div class="field"><label>Destination (placeholder)</label><input placeholder="Bank account / wallet address"></div><div class="notice">This form does not send money. Real withdrawals require a secure backend and authorized provider.</div><button class="btn full" onclick="demoWithdraw()">Simulate withdrawal</button>`;
if(type==='kyc')content=`<h3>Identity verification (demo)</h3><p class="sub">Do not upload real identity documents here.</p><div class="field"><label>Full name (sample only)</label><input id="kycname" placeholder="Example: Demo User"></div><div class="field"><label>Document type</label><select><option>Passport</option><option>National ID</option><option>Driving licence</option></select></div><div class="field"><label>Sample file (not uploaded anywhere)</label><input class="file" type="file" accept="image/*,.pdf"></div><div class="notice">This does not verify identity. A real KYC provider and secure processing are required.</div><button class="btn full" onclick="demoKyc()">Mark demo as submitted</button>`;
document.getElementById('modalroot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="modalhead"><h3>${type==='deposit'?'Deposit':type==='withdraw'?'Withdraw':'KYC'}</h3><button class="close" onclick="closeModal()">✕</button></div><div style="margin-top:16px">${content}</div><button class="btn secondary full" style="margin-top:10px" onclick="closeModal()">Cancel</button></div></div>`}
function closeModal(){document.getElementById('modalroot').innerHTML=''}
function demoDeposit(){const n=Number(document.getElementById('depositamount').value);if(!n||n<1)return toast('Enter an amount greater than zero.');state.balance+=n;closeModal();render();toast('Demo deposit added to the sample balance.')}
function demoWithdraw(){const n=Number(document.getElementById('withdrawamount').value);if(!n||n<1||n>state.balance)return toast('Enter a valid amount within the demo balance.');state.balance-=n;closeModal();render();toast('Demo withdrawal simulated; no money was sent.')}
function demoKyc(){state.kyc='DEMO SUBMITTED';closeModal();render();toast('Demo status updated. Identity was not verified.')}
function simulateTrade(){const s=document.getElementById('tradecoin').value,n=Number(document.getElementById('tradeamount').value);if(!n||n<1||n>state.balance)return toast('Enter a valid amount within demo balance.');state.balance-=n;state.assets[s]=(state.assets[s]||0)+n/coins.find(c=>c.symbol===s).price;render();toast('Demo buy simulated; no real order was placed.')}
function startBot(name){if(state.bots.includes(name))return toast('This demo bot is already active.');state.bots.push(name);render();toast(name+' started in demo mode.')}
function stopBot(i){state.bots.splice(i,1);render();toast('Demo bot stopped.')}
function openPosition(side){const size=Number(document.getElementById('futuresize').value),lev=document.getElementById('leverage').value;if(!size||size<1)return toast('Enter a valid position size.');state.positions.push({side,size,leverage:lev});render();toast(side+' demo position opened.')}
function closePosition(i){state.positions.splice(i,1);render();toast('Demo position closed.')}
render();
</script>
</body>
</html>
