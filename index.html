function setLanguage(language) {
  currentLanguage = language;
  localStorage.setItem('lcc_language', language);
  render();
}

const fmt = n => n.toLocaleString('en-US', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

// โหลดทุนจำลองที่บันทึกไว้
try {
  const savedBalance = localStorage.getItem('lcc_demo_balance');
  if (savedBalance !== null && Number.isFinite(Number(savedBalance))) {
    state.balance = Number(savedBalance);
  }
} catch (error) {
  console.warn('Unable to load demo balance.');
}

// ปุ่มเพิ่มทุนจำลองครั้งละ $10,000
function addDemoFunds() {
  const amount = 10000;
  state.balance = (Number(state.balance) || 0) + amount;

  try {
    localStorage.setItem('lcc_demo_balance', String(state.balance));
  } catch (error) {
    console.warn('Unable to save demo balance.');
  }

  render();
}

function getPortfolio() {
  const holdings = Object.entries(state.assets).map(([symbol, quantity]) => {
    const coin = coins.find(c => c.symbol === symbol);
    const price = symbol === 'USDT' ? 1 : (coin ? coin.price : 0);
    const qty = Number(quantity) || 0;

    return {
      symbol: symbol,
      quantity: qty,
      price: price,
      value: qty * price
    };
  });

  const assetsValue = holdings.reduce((sum, item) => sum + item.value, 0);

  return {
    holdings: holdings,
    assetsValue: assetsValue,
    totalValue: (Number(state.balance) || 0) + assetsValue
  };
}
function toast(msg){
  document.getElementById('toastroot').innerHTML =
    `<div class="toast">${msg}</div>`;

  setTimeout(() => {
    document.getElementById('toastroot').innerHTML = '';
  }, 2600);
}

function setPage(p){state.page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function marketRows(){
  return coins.map(c=>{
    const change = Number(c.change) || 0;
    return `<tr>
      <td><div class="coin">
        <div class="coinicon">${c.icon}</div>
        <div>${c.symbol}<small>${c.name}</small></div>
      </div></td>
      <td class="right">$${c.price < 1 ? c.price.toFixed(4) : fmt(c.price)}</td>
      <td class="right ${change >= 0 ? 'positive' : 'negative'}">${change > 0 ? '+' : ''}${change.toFixed(2)}%</td>
    </tr>`;
  }).join('');
}
function updateDemoPrices() {
  if (state.page === 'trade') {
    return;
  }

  coins.forEach(coin => {
    const oldPrice = Number(coin.price) || 1;
    const movement = (Math.random() - 0.5) * 0.002;

    coin.price = Math.max(
      0.0001,
      oldPrice * (1 + movement)
    );
  });

  render();
}

setInterval(updateDemoPrices, 5000);

function searchHomeMarkets(query) {
  const results = document.getElementById('lcc-home-search-results');
  if (!results) return;

  const q = String(query || '').trim().toLowerCase();

  if (!q) {
    results.style.display = 'none';
    results.innerHTML = '';
    return;
  }

  const items = [
    ...coins.map(c => ({
      symbol: c.symbol,
      name: c.name || c.symbol,
      category: c.type === 'stock' ? 'US Stocks' : 'Crypto'
    })),
    { symbol: 'XAUUSD', name: 'Gold', category: 'Markets' },
    { symbol: 'EURUSD', name: 'Euro / US Dollar', category: 'Forex' },
    { symbol: 'GBPUSD', name: 'British Pound / US Dollar', category: 'Forex' },
    { symbol: 'SPX', name: 'S&P 500', category: 'Indices' },
    { symbol: 'NDX', name: 'Nasdaq 100', category: 'Indices' },
    { symbol: 'MSFT', name: 'Microsoft', category: 'US Stocks' },
    { symbol: 'AMZN', name: 'Amazon', category: 'US Stocks' },
    { symbol: 'GOOGL', name: 'Alphabet', category: 'US Stocks' }
  ];

  const matches = items.filter(item =>
    item.symbol.toLowerCase().includes(q) ||
    item.name.toLowerCase().includes(q) ||
    item.category.toLowerCase().includes(q)
  );

  results.style.display = 'block';

  if (!matches.length) {
    results.innerHTML = '<div style="padding:12px">No results found</div>';
    return;
  }

  results.innerHTML = matches.map(item => `
    <div style="padding:12px;border-bottom:1px solid var(--line)">
      <strong>${item.symbol}</strong>
      <span style="margin-left:8px">${item.name}</span>
      <small style="display:block;opacity:.7">${item.category}</small>
    </div>
  `).join('');
}

function closeModal(){document.getElementById('modalroot').innerHTML=''}
function demoDeposit(){const n=Number(document.getElementById('depositamount').value);if(!n||n<1)return toast('Enter an amount greater than zero.');state.balance+=n;closeModal();render();toast('Demo deposit added to the sample balance.')}
function demoWithdraw(){const n=Number(document.getElementById('withdrawamount').value);if(!n||n<1||n>state.balance)return toast('Enter a valid amount within the demo balance.');state.balance-=n;closeModal();render();toast('Demo withdrawal simulated; no money was sent.')}

function simulateTrade() {
  const coinInput = document.getElementById('tradecoin');
  const amountInput = document.getElementById('tradeamount');

  if (!coinInput || !amountInput) {
    return toast('Trade form not found.');
  }

  const symbol = coinInput.value;
  const amount = Number(amountInput.value);
  const coin = coins.find(c => c.symbol === symbol);

  if (!coin || !Number.isFinite(coin.price) || coin.price <= 0) {
    return toast('Invalid asset price.');
  }

  if (!Number.isFinite(amount) || amount < 1) {
    return toast('Enter an amount of at least $1.');
  }

  if (!Number.isFinite(state.balance) || amount > state.balance) {
    return toast('Insufficient demo balance.');
  }

  const quantity = amount / coin.price;

  if (!Number.isFinite(quantity) || quantity <= 0) {
    return toast('Unable to calculate purchase quantity.');
  }

  state.balance -= amount;
  state.assets[symbol] = (state.assets[symbol] || 0) + quantity;

  render();
  toast(
    `Bought ${symbol} with $${amount.toFixed(2)} in paper trading.`
  );
}

function simulateSell() {
  const coinInput = document.getElementById('tradecoin');
  const amountInput = document.getElementById('tradeamount');

  if (!coinInput || !amountInput) {
    return toast('Trade form not found.');
  }

  const symbol = coinInput.value;
  const amount = Number(amountInput.value);
  const coin = coins.find(c => c.symbol === symbol);

  if (!coin || !Number.isFinite(coin.price) || coin.price <= 0) {
    return toast('Invalid asset price.');
  }

  if (!Number.isFinite(amount) || amount < 1) {
    return toast('Enter an amount of at least $1.');
  }

  const owned = Number(state.assets[symbol]) || 0;
  const quantityToSell = amount / coin.price;

  if (quantityToSell > owned) {
    return toast('Not enough of this asset to sell.');
  }

  state.assets[symbol] = owned - quantityToSell;
  state.balance += amount;

  render();
  toast(`Sold ${symbol} for $${amount.toFixed(2)} in paper trading.`);
}

function startBot(name){if(state.bots.includes(name))return toast('This demo bot is already active.');state.bots.push(name);render();toast(name+' started in demo mode.')}
let tradeChartInstance = null;
async function loadTradeChart() {
  const container = document.getElementById('tradeChart');
  const marketInput = document.getElementById('chartMarket');
  const assetInput = document.getElementById('tradecoin');
  const priceDisplay = document.getElementById('chartPrice');
  const message = document.getElementById('chartMessage');

  if (!container || !marketInput || !assetInput) return;

  const isStock = marketInput.value === 'stocks';
  const symbol = assetInput.value;

  // TradingView symbol
  const tvSymbol = isStock
    ? (['AAPL', 'TSLA', 'NVDA'].includes(symbol)
        ? 'NASDAQ:' + symbol
        : 'NASDAQ:AAPL')
    : 'BINANCE:' + symbol + 'USDT';

  // Show the TradingView chart
  container.innerHTML = '';
  container.style.height = '380px';

  const widget = document.createElement('div');
  widget.className = 'tradingview-widget-container';
  widget.style.height = '100%';
  widget.style.width = '100%';

  const chart = document.createElement('div');
  chart.className = 'tradingview-widget-container__widget';
  chart.style.height = '100%';
  chart.style.width = '100%';

  widget.appendChild(chart);
  container.appendChild(widget);

  const script = document.createElement('script');
  script.src =
    'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
  script.async = true;

  script.textContent = JSON.stringify({
    autosize: true,
    symbol: tvSymbol,
    interval: '60',
    timezone: 'Etc/UTC',
    theme: 'dark',
    style: '1',
    locale: 'en',
    allow_symbol_change: true,
    calendar: false,
    support_host: 'https://www.tradingview.com'
  });

  widget.appendChild(script);

  // Connect crypto prices to Paper Trading
  if (!isStock) {
    try {
      if (message) message.textContent = 'Loading market price...';

      const response = await fetch(
        'https://data-api.binance.vision/api/v3/ticker/price?symbol=' +
        encodeURIComponent(symbol + 'USDT')
      );

      if (!response.ok) {
        throw new Error('Price request failed');
      }

      const data = await response.json();
      const livePrice = Number(data.price);

      if (!Number.isFinite(livePrice) || livePrice <= 0) {
        throw new Error('Invalid price');
      }

      const coin = coins.find(c => c.symbol === symbol);

      if (coin) {
        coin.price = livePrice;
      }

      if (priceDisplay) {
        priceDisplay.textContent =
          '$' + livePrice.toLocaleString('en-US', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 8
          });
      }

      if (message) {
        message.textContent =
          'Crypto reference price from Binance public market data';
      }
    } catch (error) {
      if (message) {
        message.textContent =
          'Could not load crypto price. Check connection and try again.';
      }
    }
  } else {
    if (priceDisplay) priceDisplay.textContent = '$--';
    if (message) {
      message.textContent =
        'TradingView chart loaded. Stock Paper Trading price feed is not connected yet.';
    }
  }
}
